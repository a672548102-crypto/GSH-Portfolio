<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美工设计 | 高帅航</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/design-works.css">

    <style>
        /* ============================================================
        强制移动端菜单样式（覆盖外部CSS，确保手机端正常工作）
        ============================================================ */

        /* 导航容器保持相对定位 */
        .navbar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 72px !important;
            z-index: 9999 !important;
            background: rgba(247, 244, 235, 0.72) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border-bottom: 1px solid rgba(180, 160, 140, 0.20) !important;
            padding: 0 !important;
        }

        .nav-container {
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            max-width: 1100px !important;
            margin: 0 auto !important;
            padding: 0 20px !important;
            position: relative !important;
        }

        .logo {
            font-size: 24px !important;
            font-weight: 900 !important;
            letter-spacing: 1px !important;
            text-decoration: none !important;
            color: #2c241c !important;
            font-family: 'Noto Serif SC', 'Songti SC', serif !important;
            flex-shrink: 0 !important;
            z-index: 10 !important;
        }
        .logo span {
            color: #c43b3b !important;
            font-size: 20px !important;
            margin-left: 4px !important;
        }

        /* 导航链接 - 桌面端 */
        .nav-links {
            list-style: none !important;
            display: flex !important;
            gap: 35px !important;
            align-items: center !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .nav-links li {
            margin: 0 !important;
            padding: 0 !important;
        }
        .nav-links a {
            text-decoration: none !important;
            color: #7a6a5a !important;
            font-size: 15px !important;
            transition: .3s !important;
            font-family: 'Noto Serif SC', 'Songti SC', serif !important;
            border-bottom: 2px solid transparent !important;
            padding: 4px 0 !important;
        }
        .nav-links a:hover {
            color: #2c241c !important;
        }
        .nav-links a.active {
            color: #c43b3b !important;
            border-bottom-color: #c43b3b !important;
        }

        /* 汉堡菜单按钮 - 默认隐藏，手机端显示 */
        .menu-toggle {
            display: none !important;
            flex-direction: column !important;
            gap: 5px !important;
            background: none !important;
            border: none !important;
            cursor: pointer !important;
            padding: 6px 4px !important;
            z-index: 99999 !important;
            flex-shrink: 0 !important;
            margin-left: 12px !important;
        }
        .menu-toggle span {
            display: block !important;
            width: 26px !important;
            height: 2px !important;
            background: #2c241c !important;
            border-radius: 2px !important;
            transition: .3s !important;
            pointer-events: none !important;
        }

        /* ============================================================
        手机端样式 (768px及以下)
        ============================================================ */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex !important;
            }

            /* 导航菜单默认隐藏 */
            .nav-links {
                display: none !important;
                position: absolute !important;
                top: 72px !important;
                left: 0 !important;
                width: 100% !important;
                background: rgba(247, 244, 235, 0.96) !important;
                backdrop-filter: blur(25px) !important;
                -webkit-backdrop-filter: blur(25px) !important;
                flex-direction: column !important;
                padding: 20px 28px !important;
                gap: 16px !important;
                border-bottom: 1px solid rgba(180, 160, 140, 0.20) !important;
                box-shadow: 0 20px 60px rgba(0,0,0,0.10) !important;
                z-index: 9998 !important;
                border-radius: 0 0 16px 16px !important;
            }

            /* 菜单打开状态 */
            .nav-links.open {
                display: flex !important;
            }

            .nav-links a {
                font-size: 16px !important;
                padding: 10px 0 !important;
                border-bottom: 1px solid rgba(180, 160, 140, 0.10) !important;
                width: 100% !important;
                text-align: center !important;
            }
            .nav-links a:last-child {
                border-bottom: none !important;
            }
        }

        /* ============================================================
        桌面端样式 (769px及以上)
        ============================================================ */
        @media (min-width: 769px) {
            .menu-toggle {
                display: none !important;
            }
            .nav-links {
                display: flex !important;
                position: static !important;
                flex-direction: row !important;
                background: transparent !important;
                backdrop-filter: none !important;
                padding: 0 !important;
                gap: 35px !important;
                border-bottom: none !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            .nav-links a {
                border-bottom: 2px solid transparent !important;
                padding: 4px 0 !important;
                width: auto !important;
                text-align: left !important;
            }
        }

        /* 给导航留出占位空间 */
        .navbar-placeholder {
            height: 72px;
            width: 100%;
        }

        /* 其他页面内容样式保持原有 */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-header {
            text-align: center;
            padding: 30px 0 16px;
        }
        .page-header h1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: 2.2rem;
            font-weight: 700;
            margin: 10px 0 4px;
            color: #2c241c;
        }
        .page-header p {
            color: #7a6a5a;
            font-size: 0.95rem;
        }
        .tag {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(196, 59, 59, 0.08);
            color: #c43b3b;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .filter-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 24px 0 20px;
            padding: 0 4px;
        }
        .filter-box .filter {
            padding: 8px 22px;
            border-radius: 30px;
            border: 1px solid rgba(180, 160, 140, 0.20);
            background: rgba(255, 248, 235, 0.40);
            color: #7a6a5a;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            letter-spacing: 0.5px;
        }
        .filter-box .filter .count {
            display: inline-block;
            font-size: 11px;
            opacity: 0.5;
            margin-left: 4px;
        }
        .filter-box .filter:hover {
            border-color: #c9a84c;
            color: #2c241c;
            background: rgba(201, 168, 76, 0.08);
            transform: translateY(-2px);
        }
        .filter-box .filter.active {
            background: linear-gradient(135deg, #c9a84c, #e8d5a3, #b8943a);
            color: #1a100a;
            border-color: #c9a84c;
            font-weight: 600;
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.15);
            transform: translateY(-2px);
        }

        .design-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            padding-bottom: 100px;
        }

        .design-card {
            background: rgba(255, 248, 235, 0.40);
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(180, 160, 140, 0.20);
            transition: .4s;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .design-card:hover {
            transform: translateY(-10px);
            border-color: rgba(196, 59, 59, 0.12);
            background: rgba(255, 248, 235, 0.70);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
        }

        .design-card .cover-box {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: #e8e0d6;
        }
        .design-card .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .5s;
        }
        .design-card:hover .cover-box img {
            transform: scale(1.06);
        }

        .design-type {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: #c43b3b;
            backdrop-filter: blur(5px);
            z-index: 2;
        }
        .design-type.type-product { background: #7a6a5a; }
        .design-type.type-giftbox { background: #c43b3b; }
        .design-type.type-packaging { background: #2c241c; }
        .design-type.type-poster { background: #7a6a5a; }
        .design-type.type-other { background: #b8a898; color: #2c241c; }
        .design-type.type-ai { background: linear-gradient(135deg, #9B59B6, #8E44AD); }
        .design-type.type-detail { background: linear-gradient(135deg, #3498DB, #2980B9); }
        .design-type.type-live { background: linear-gradient(135deg, #E67E22, #D35400); }
        .design-type.type-retouch { background: linear-gradient(135deg, #1ABC9C, #16A085); }

        .file-badge {
            position: absolute;
            bottom: 14px;
            right: 14px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            z-index: 3;
            letter-spacing: 0.5px;
        }

        .category-badge {
            position: absolute;
            bottom: 14px;
            right: 14px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            color: #fff;
            background: rgba(13, 8, 5, 0.60);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .design-info {
            padding: 20px;
        }
        .design-info h3 {
            font-size: 17px;
            font-weight: 700;
            color: #2c241c;
            margin-bottom: 6px;
            font-family: 'Noto Serif SC', 'Songti SC', serif;
        }
        .design-info p {
            color: #7a6a5a;
            font-size: 13px;
            line-height: 1.7;
        }

        .pagination-wrapper {
            display: flex;
            justify-content: center;
            padding: 40px 0 20px;
        }
        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            border-radius: 30px;
            border: 1px solid rgba(180, 160, 140, 0.20);
            background: rgba(255, 248, 235, 0.40);
            color: #7a6a5a;
            font-size: 14px;
            cursor: pointer;
            transition: .3s;
            backdrop-filter: blur(10px);
            font-family: 'Inter', 'PingFang SC', sans-serif;
        }
        .page-btn:hover:not(:disabled) {
            border-color: #c9a84c;
            color: #2c241c;
            background: rgba(201, 168, 76, 0.08);
        }
        .page-btn.active {
            background: linear-gradient(135deg, #c9a84c, #e8d5a3, #b8943a);
            color: #1a100a;
            border-color: #c9a84c;
            font-weight: 600;
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .page-ellipsis {
            color: #b8a898;
            padding: 0 4px;
            font-size: 14px;
        }
        .page-info {
            color: #b8a898;
            font-size: 13px;
            margin-left: 12px;
            padding-left: 12px;
            border-left: 1px solid rgba(180, 160, 140, 0.20);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #b8a898;
            border-top: 1px solid rgba(180, 160, 140, 0.20);
            margin-top: 40px;
        }

        .flow-light, .stardust {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .design-grid {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                padding-bottom: 60px;
            }
            .page-header h1 {
                font-size: 1.8rem;
            }
            .filter-box .filter {
                padding: 6px 14px;
                font-size: 12px;
            }
            .pagination {
                gap: 4px;
            }
            .page-btn {
                min-width: 34px;
                height: 34px;
                font-size: 12px;
                padding: 0 8px;
            }
            .page-info {
                font-size: 11px;
                margin-left: 8px;
                padding-left: 8px;
            }
        }
        @media (max-width: 480px) {
            .design-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .filter-box .filter {
                padding: 5px 12px;
                font-size: 11px;
            }
            .page-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    导航（完全独立，不依赖任何外部JS）
    ============================================================ -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">GSH.<span>个人作品集</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">首页</a></li>
                <li><a href="collection.html">案例</a></li>
                <li><a href="personal-video.html">抖音</a></li>

            </ul>
            <button class="menu-toggle" id="menuToggle">

    </nav>

    <!-- 占位空间（避免导航遮挡内容） -->
    <div class="navbar-placeholder"></div>

    <!-- ============================================================

    ============================================================ -->
    <section class="page-header">
        <div class="container">

    <footer>© 2026 GSH Portfolio</footer>

    <div class="flow-light"></div>

    <!-- ============================================================
    独立菜单切换逻辑（不依赖任何外部JS文件，确保手机端正常工作）
    ============================================================ -->
    <script>
        (function() {
            // 等待页面加载完成
            function initMenu() {
                var toggle = document.getElementById('menuToggle');
                var navLinks = document.getElementById('navLinks');

                if (!toggle) {
                    console.warn('❌ 菜单按钮 #menuToggle 未找到');
                    return;
                }
                if (!navLinks) {
                    console.warn('❌ 导航链接 #navLinks 未找到');
                    return;
                }

                // 点击按钮切换菜单
                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    navLinks.classList.toggle('open');
                });

                // 点击页面其他区域关闭菜单
                document.addEventListener('click', function(e) {
                    if (!navLinks.contains(e.target) && !toggle.contains(e.target)) {
                        navLinks.classList.remove('open');
                    }
                });

                // 触摸设备：滑动不关闭菜单
                var touchStartX = 0;
                var touchStartY = 0;
                document.addEventListener('touchstart', function(e) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });
                document.addEventListener('touchend', function(e) {
                    var deltaX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                    var deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
                    if (deltaX > 20 || deltaY > 20) return;
                    if (!navLinks.contains(e.target) && !toggle.contains(e.target)) {
                        navLinks.classList.remove('open');
                    }
                });

                // 窗口大小变化（横竖屏切换）时重置菜单
                window.addEventListener('resize', function() {
                    if (window.innerWidth > 768) {
                        navLinks.classList.remove('open');
                    }
                });

                console.log('✅ 移动端菜单已修复');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initMenu);
            } else {
                initMenu();
            }
        })();
    </script>

    <!-- 加载其他功能脚本（设计作品数据加载、分类筛选、分页等） -->
    <script src="js/design-works.js"></script>

</body>
